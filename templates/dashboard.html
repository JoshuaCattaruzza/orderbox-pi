<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrderBox</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <span class="logo">OrderBox</span>
    <span id="status" class="status disconnected">● Connecting…</span>
    <span id="clock" class="clock"></span>
  </header>

  <main class="columns">
    <section class="column">
      <div class="col-header incoming">
        Incoming <span id="new-count" class="count">0</span>
      </div>
      <div id="new-orders" class="orders-list"></div>
    </section>

    <section class="column">
      <div class="col-header inprep">
        In Prep <span id="prep-count" class="count">0</span>
      </div>
      <div id="prep-orders" class="orders-list"></div>
    </section>
  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
