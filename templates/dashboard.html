<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OrderBox</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <span class="logo">OrderBox</span>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="live">Live</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>
    <div class="header-right">
      <span id="status" class="status disconnected">● Connecting…</span>
      <span id="clock" class="clock"></span>
    </div>
  </header>

  <main class="columns" id="live-view">
    <section class="column">
      <div class="col-header incoming">
        Incoming <span id="new-count" class="count">0</span>
      </div>
      <div id="new-orders" class="orders-list"></div>
    </section>

    <section class="column">
      <div class="col-header inprep">
        In Prep <span id="prep-count" class="count">0</span>
      </div>
      <div id="prep-orders" class="orders-list"></div>
    </section>
  </main>

  <div id="history-view" class="hidden">
    <div id="history-list" class="history-list"></div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
