<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OrderBox — Settings</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { overflow: auto; }
    .settings-wrap {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }
    .settings-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .settings-header a {
      color: var(--muted);
      font-size: 2rem;
      text-decoration: none;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 64px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
    }
    .settings-header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .wifi-status {
      font-size: 0.95rem;
      margin-bottom: 20px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
    }
    .wifi-status .connected { color: var(--green); }
    .wifi-status .disconnected { color: var(--muted); }

    .network-list {
      list-style: none;
      margin-bottom: 20px;
      max-height: 220px;
      overflow-y: auto;
    }
    .network-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .network-item:hover, .network-item:active { background: rgba(255,255,255,0.06); }
    .network-item .ssid { font-weight: 600; }
    .network-item .signal { font-size: 0.82rem; color: var(--muted); }
    .network-item .lock { font-size: 0.8rem; color: var(--muted); margin-left: 6px; }
    .network-item.selected { background: rgba(0,196,140,0.1); }
    .network-item.selected .ssid { color: var(--green); }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 16px;
      cursor: text;
      -webkit-tap-highlight-color: transparent;
    }
    input:focus {
      border-color: var(--green);
      background: rgba(0,196,140,0.06);
      outline: none;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 13px 22px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 48px;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-green  { background: var(--green);  color: #000; }
    .btn-muted  { background: var(--border); color: var(--text); }

    #msg {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    .msg-ok  { color: var(--green); }
    .msg-err { color: var(--red); }

    .scan-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .scan-row h2 { margin: 0; }
    #scan-btn {
      font-size: 0.8rem;
      padding: 8px 14px;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <div class="settings-wrap">
    <div class="settings-header">
      <a href="/" title="Back">&#8592;</a>
      <h1>Settings</h1>
    </div>

    <div class="card">
      <h2>WiFi</h2>
      <div class="wifi-status" id="wifi-status">Checking…</div>

      <div class="scan-row">
        <h2>Available Networks</h2>
        <button class="btn btn-muted" id="scan-btn" onclick="scanNetworks()">Scan</button>
      </div>
      <ul class="network-list" id="network-list">
        <li style="color:var(--muted);font-size:0.9rem;padding:10px 14px">Press Scan to search for networks</li>
      </ul>

      <label for="ssid-input">Network name (SSID)</label>
      <input type="text" id="ssid-input" autocomplete="off" autocorrect="off"
             spellcheck="false" placeholder="e.g. MyRestaurant_WiFi"
             onfocus="showKeyboard()" />

      <label for="pw-input">Password</label>
      <input type="password" id="pw-input" autocomplete="off" placeholder="Leave blank if open network"
             onfocus="showKeyboard()" />

      <div class="btn-row">
        <button class="btn btn-green" id="connect-btn" onclick="connectWifi()">Connect</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

  <script>
  (function () {
    function setMsg(text, ok) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = ok ? 'msg-ok' : 'msg-err';
    }

    function refreshStatus() {
      fetch('/api/wifi/status')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var el = document.getElementById('wifi-status');
          if (d.connection) {
            el.innerHTML = '<span class="connected">&#10003; Connected to <strong>' + esc(d.connection) + '</strong></span>';
          } else {
            el.innerHTML = '<span class="disconnected">&#9679; Not connected (' + esc(d.state) + ')</span>';
          }
        })
        .catch(function () {
          document.getElementById('wifi-status').textContent = 'Unable to read WiFi status';
        });
    }

    window.scanNetworks = function () {
      var btn = document.getElementById('scan-btn');
      btn.disabled = true;
      btn.textContent = 'Scanning…';
      var list = document.getElementById('network-list');
      list.innerHTML = '<li style="color:var(--muted);font-size:0.9rem;padding:10px 14px">Scanning…</li>';
      fetch('/api/wifi/networks')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          btn.disabled = false;
          btn.textContent = 'Scan';
          if (!d.networks || !d.networks.length) {
            list.innerHTML = '<li style="color:var(--muted);font-size:0.9rem;padding:10px 14px">No networks found</li>';
            return;
          }
          list.innerHTML = '';
          d.networks.forEach(function (n) {
            var li = document.createElement('li');
            li.className = 'network-item';
            var bars = signalBars(n.signal);
            var lock = n.security && n.security !== '--' ? ' <span class="lock">&#128274;</span>' : '';
            li.innerHTML = '<span class="ssid">' + esc(n.ssid) + lock + '</span>' +
                           '<span class="signal">' + bars + ' ' + n.signal + '%</span>';
            li.addEventListener('click', function () {
              document.querySelectorAll('.network-item').forEach(function (x) { x.classList.remove('selected'); });
              li.classList.add('selected');
              document.getElementById('ssid-input').value = n.ssid;
              document.getElementById('pw-input').focus();
            });
            list.appendChild(li);
          });
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Scan';
          list.innerHTML = '<li style="color:var(--red);font-size:0.9rem;padding:10px 14px">Scan failed</li>';
        });
    };

    window.connectWifi = function () {
      var ssid = document.getElementById('ssid-input').value.trim();
      var pw   = document.getElementById('pw-input').value;
      if (!ssid) { setMsg('Please enter an SSID', false); return; }
      var btn = document.getElementById('connect-btn');
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      setMsg('', true);
      fetch('/api/wifi/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid: ssid, password: pw })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          btn.disabled = false;
          btn.textContent = 'Connect';
          if (d.ok) {
            setMsg('Connected to ' + ssid, true);
            refreshStatus();
          } else {
            setMsg(d.error || 'Connection failed', false);
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Connect';
          setMsg('Request failed', false);
        });
    };

    window.showKeyboard = function () {
      fetch('/api/keyboard/show', { method: 'POST' });
    };

    function signalBars(pct) {
      if (pct >= 75) return '▂▄▆█';
      if (pct >= 50) return '▂▄▆░';
      if (pct >= 25) return '▂▄░░';
      return '▂░░░';
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    refreshStatus();
  })();
  </script>
</body>
</html>
